<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 20: Conditions and Loops Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Day 20: Conditions & Loops</h1>
            <p class="subtitle">Interactive Transaction Processor Simulation</p>
        </header>

        <main class="grid">
            <!-- Control Panel -->
            <section class="card control-panel">
                <h2>Configuration</h2>
                <div class="form-group">
                    <label for="budget">Initial Budget ($):</label>
                    <input type="number" id="budget" value="700" min="1">
                </div>
                <button id="run-btn" class="btn btn-primary">Run Simulation</button>
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
            </section>

            <!-- Live Console / Execution Log -->
            <section class="card console-card">
                <h2>Execution Log</h2>
                <div id="console" class="console-output">
                    <span class="system-msg">Click "Run Simulation" to start...</span>
                </div>
            </section>

            <!-- Data Table -->
            <section class="card data-card">
                <h2>Input Transactions</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        const transactions = [
            { id: 1, customer: "Alice", amount: 120.0, category: "Electronics" },
            { id: 2, customer: "Bob", amount: -50.0, category: "Books" },
            { id: 3, customer: "Charlie", amount: 600.0, category: "Electronics" },
            { id: 4, customer: "David", amount: 50.0, category: "Groceries" },
            { id: 5, customer: "Eve", amount: 200.0, category: "Books" }
        ];

        // Populate Table
        const tbody = document.getElementById('data-body');
        transactions.forEach(tx => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${tx.id}</td>
                <td>${tx.customer}</td>
                <td class="${tx.amount <= 0 ? 'text-danger' : ''}">$${tx.amount.toFixed(2)}</td>
                <td>${tx.category}</td>
            `;
            tbody.appendChild(row);
        });

        // Simulation Logic
        document.getElementById('run-btn').addEventListener('click', () => {
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML = '';
            
            let budget = parseFloat(document.getElementById('budget').value);
            log(`Starting processing with budget: $${budget.toFixed(2)}`, 'system');

            let totalProcessed = 0;
            let totalDiscounted = 0;

            for (let i = 0; i < transactions.length; i++) {
                const tx = transactions[i];
                
                // 1. Validation Condition
                if (tx.amount <= 0) {
                    log(`[SKIP] Tx ${tx.id} (${tx.customer}): Invalid amount $${tx.amount.toFixed(2)}`, 'skip');
                    continue;
                }

                // 2. Calculate Discount
                let discount = 0;
                if (tx.amount > 500) {
                    discount = tx.amount * 0.20;
                } else if (tx.amount > 100) {
                    discount = tx.amount * 0.10;
                }
                const netAmount = tx.amount - discount;

                // 3. Budget Check Condition
                if (netAmount > budget) {
                    log(`[STOP] Tx ${tx.id} (${tx.customer}) Net $${netAmount.toFixed(2)} exceeds remaining budget $${budget.toFixed(2)}. Stopping loop.`, 'stop');
                    break;
                }

                // 4. Process
                budget -= netAmount;
                totalDiscounted += discount;
                totalProcessed++;
                log(`[PROCESSED] Tx ${tx.id} (${tx.customer}): Net $${netAmount.toFixed(2)} (Saved $${discount.toFixed(2)}). Budget left: $${budget.toFixed(2)}`, 'success');
            }

            log(`\n=== Summary ===\nProcessed: ${totalProcessed} | Total Saved: $${totalDiscounted.toFixed(2)} | Remaining Budget: $${budget.toFixed(2)}`, 'summary');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('console').innerHTML = '<span class="system-msg">Click "Run Simulation" to start...</span>';
            document.getElementById('budget').value = 700;
        });

        function log(message, type) {
            const consoleDiv = document.getElementById('console');
            const span = document.createElement('span');
            span.className = `log-entry ${type}`;
            span.innerText = message;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
    </script>
</body>
</html>
